<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlockRig Studio</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    
    <style>
      /* Mobil WebView Temel Ayarları */
      html, body {
        overflow: hidden !important;
        touch-action: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0a0d12;
      }

      /* 3D Canvas ve Dokunma */
      canvas, .viewport, .viewport canvas {
        touch-action: none !important;
        -webkit-touch-callout: none !important;
        -webkit-user-select: none !important;
        user-select: none !important;
      }

      /* Sol üstteki brand logosu tıklanamaz */
      .topbar .brand {
        cursor: default !important;
        pointer-events: none !important;
      }

      @keyframes bootSpin {
        to { transform: rotate(360deg); }
      }

      /* ========================================================= */
      /* MOBİL ÖZEL KAMERA WASD & OK TUŞLARI KONTROL PANELİ        */
      /* ========================================================= */
      #mobile-camera-controls {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        display: none;
        justify-content: space-between;
        align-items: flex-end;
        padding: 0 16px;
        z-index: 99999;
        pointer-events: none;
      }

      #mobile-camera-controls.active {
        display: flex !important;
      }

      .dpad-container {
        display: grid;
        grid-template-columns: repeat(3, 46px);
        grid-template-rows: repeat(3, 46px);
        gap: 6px;
        background: rgba(15, 20, 28, 0.88);
        padding: 8px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(14px);
        pointer-events: auto;
      }

      .elevation-container {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: rgba(15, 20, 28, 0.88);
        padding: 8px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.65);
        backdrop-filter: blur(14px);
        pointer-events: auto;
      }

      .cam-btn {
        width: 46px;
        height: 46px;
        background: #1e293b;
        border: 1px solid #475569;
        border-radius: 12px;
        color: #f8fafc;
        font-size: 18px;
        font-weight: bold;
        display: flex;
        align-items: center;
        justify-content: center;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none !important;
        transition: transform 0.05s ease, background 0.05s ease;
      }

      .cam-btn:active, .cam-btn.pressed {
        background: #2563eb !important;
        border-color: #60a5fa !important;
        color: #ffffff !important;
        transform: scale(0.92);
      }

      .btn-up    { grid-column: 2; grid-row: 1; }
      .btn-left  { grid-column: 1; grid-row: 2; }
      .btn-down  { grid-column: 2; grid-row: 3; }
      .btn-right { grid-column: 3; grid-row: 2; }
      .dpad-center {
        grid-column: 2; grid-row: 2;
        background: transparent;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        font-size: 10px;
        font-weight: bold;
      }

      #cam-toggle-trigger {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 99998;
        width: 40px;
        height: 40px;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        color: #cbd5e1;
        font-size: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(8px);
        box-shadow: 0 4px 14px rgba(0,0,0,0.5);
        user-select: none;
        -webkit-user-select: none;
      }

      #cam-toggle-trigger.active {
        background: #2563eb;
        color: #fff;
        border-color: #93c5fd;
      }

      /* PC / Masaüstü ortamında (fiziksel klavye ve fare varken) mobil sanal okları gizle */
      @media (hover: hover) and (pointer: fine) and (min-width: 900px) {
        #cam-toggle-trigger,
        #mobile-camera-controls {
          display: none !important;
        }
      }

      /* ========================================================= */
      /* ULTRA MODERN RENDER PREVIEW MODAL                         */
      /* ========================================================= */
      .render-modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(3, 7, 18, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        z-index: 1000000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .render-modal-backdrop.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .render-modal-card {
        background: linear-gradient(165deg, rgba(30, 41, 59, 0.96) 0%, rgba(15, 23, 42, 0.98) 100%);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 40px rgba(59, 130, 246, 0.18);
        width: 100%;
        max-width: 520px;
        max-height: 94vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform: scale(0.92) translateY(12px);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .render-modal-backdrop.visible .render-modal-card {
        transform: scale(1) translateY(0);
      }

      .render-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px 12px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .render-header-left {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .render-badge-icon {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
      }

      .render-modal-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 17px;
        font-weight: 700;
        color: #f8fafc;
        letter-spacing: -0.3px;
      }

      .render-modal-subtitle {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        color: #94a3b8;
        margin-top: 2px;
      }

      .render-close-btn {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: #94a3b8;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s, color 0.15s, transform 0.1s;
      }

      .render-close-btn:active {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
        transform: scale(0.92);
      }

      .render-preview-container {
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        max-height: 44vh;
        min-height: 180px;
      }

      .render-preview-checkerboard {
        width: 100%;
        height: 100%;
        max-height: 42vh;
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b111e;
        background-image: 
          linear-gradient(45deg, #151e2e 25%, transparent 25%),
          linear-gradient(-45deg, #151e2e 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #151e2e 75%),
          linear-gradient(-45deg, transparent 75%, #151e2e 75%);
        background-size: 16px 16px;
        background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
        padding: 8px;
        box-sizing: border-box;
      }

      #render-preview-img {
        max-width: 100%;
        max-height: 38vh;
        object-fit: contain;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.5));
        transition: transform 0.2s ease;
      }

      .render-location-box {
        margin: 0 20px 14px 20px;
        background: rgba(15, 23, 42, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 14px;
        padding: 10px 14px;
      }

      .render-location-status {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
      }

      .render-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: pulseStatus 2s infinite;
      }

      @keyframes pulseStatus {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.2); }
      }

      .render-status-label {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 12px;
        font-weight: 600;
        color: #34d399;
        letter-spacing: 0.2px;
      }

      .render-path-row {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(0, 0, 0, 0.35);
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .render-folder-icon {
        font-size: 15px;
      }

      .render-path-text {
        font-family: "JetBrains Mono", Consolas, Menlo, monospace;
        font-size: 11px;
        color: #e2e8f0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
        direction: rtl;
        text-align: left;
      }

      .render-copy-btn {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 8px;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #cbd5e1;
        cursor: pointer;
        transition: background 0.15s, transform 0.1s;
      }

      .render-copy-btn:active {
        background: #2563eb;
        color: #fff;
        transform: scale(0.9);
      }

      .render-modal-actions {
        display: flex;
        gap: 10px;
        padding: 0 20px 20px 20px;
      }

      .render-action-btn {
        flex: 1;
        padding: 12px 14px;
        border-radius: 14px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.15s, opacity 0.15s;
        border: none;
      }

      .render-action-btn:active {
        transform: scale(0.96);
      }

      .btn-share {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        color: #ffffff;
        box-shadow: 0 4px 16px rgba(37, 99, 235, 0.4);
      }

      .btn-open {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18) !important;
        color: #f1f5f9;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }

      .btn-dismiss {
        flex: 0 0 75px;
        background: rgba(148, 163, 184, 0.1);
        border: 1px solid rgba(148, 163, 184, 0.2) !important;
        color: #94a3b8;
      }
    </style>

    <script>
      // Global Görsel Hata Yakalayıcı (Siyah ekranda kalmayı engeller, hatayı doğrudan ekrana yazar)
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var loader = document.getElementById('boot-loader');
        if (loader) loader.style.display = 'none';

        var d = document.createElement('div');
        d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#7f1d1d;color:#fef2f2;z-index:99999999;padding:24px;font-family:monospace;font-size:13px;overflow:auto;line-height:1.6;';
        d.innerHTML = '<h2 style="color:#fecaca;margin-top:0;">⚠️ UYGULAMA BAŞLATMA HATASI</h2><p><b>Hata:</b> ' + msg + '</p><p><b>Dosya:</b> ' + url + '</p><p><b>Satır:</b> ' + lineNo + '</p><pre style="background:#450a0a;padding:12px;border-radius:6px;white-space:pre-wrap;">' + (error ? (error.stack || error.message) : 'Hata yığını yok') + '</pre>';
        document.body.appendChild(d);
        return false;
      };

      // 1. Hash Kontrolü
      if (!window.location.hash || window.location.hash === '#' || window.location.hash === '') {
        window.location.hash = '#app';
      }

      // 2. OFFLINE XHR FETCH POLYFILL
      (function() {
        var originalFetch = window.fetch;
        window.fetch = function(url, options) {
          var urlStr = (typeof url === 'string') ? url : (url && url.url ? url.url : '');
          
          var isLocal = window.location.protocol === 'file:' ||
                        urlStr.indexOf('models/') !== -1 ||
                        urlStr.indexOf('assets/') !== -1 ||
                        urlStr.startsWith('./') ||
                        urlStr.startsWith('models/') ||
                        (!urlStr.startsWith('http:') && !urlStr.startsWith('https:') && !urlStr.startsWith('data:'));

          if (isLocal) {
            return new Promise(function(resolve, reject) {
              var xhr = new XMLHttpRequest();
              xhr.open((options && options.method) || 'GET', urlStr, true);
              
              if (urlStr.indexOf('.bobj') !== -1 || urlStr.indexOf('.json') !== -1 || urlStr.indexOf('.obj') !== -1) {
                xhr.responseType = 'text';
              } else {
                xhr.responseType = (options && options.responseType) ? options.responseType : 'blob';
              }

              xhr.onload = function() {
                var isOk = (xhr.status === 200 || xhr.status === 0);
                if (isOk) {
                  var resData = xhr.response;
                  resolve({
                    ok: true,
                    status: 200,
                    statusText: 'OK',
                    text: function() {
                      if (typeof resData === 'string') return Promise.resolve(resData);
                      return Promise.resolve(xhr.responseText || '');
                    },
                    json: function() {
                      var str = (typeof resData === 'string') ? resData : xhr.responseText;
                      return Promise.resolve(JSON.parse(str));
                    },
                    blob: function() {
                      if (resData instanceof Blob) return Promise.resolve(resData);
                      return Promise.resolve(new Blob([resData]));
                    },
                    arrayBuffer: function() {
                      if (resData instanceof ArrayBuffer) return Promise.resolve(resData);
                      return Promise.resolve(new ArrayBuffer(0));
                    }
                  });
                } else {
                  if (originalFetch) originalFetch(url, options).then(resolve).catch(reject);
                  else reject(new Error('Yüklenemedi: ' + urlStr));
                }
              };

              xhr.onerror = function() {
                if (originalFetch) originalFetch(url, options).then(resolve).catch(reject);
                else reject(new Error('Ağ hatası: ' + urlStr));
              };

              try {
                xhr.send((options && options.body) || null);
              } catch (e) {
                if (originalFetch) originalFetch(url, options).then(resolve).catch(reject);
                else reject(e);
              }
            });
          }

          return originalFetch.apply(this, arguments);
        };
      })();

      // 3. MOBİL KAMERA WASD TUŞ MOTORU
      window.sendCamKey = function(keyName, keyCode, isDown) {
        var evtType = isDown ? 'keydown' : 'keyup';
        var keyEvent = new KeyboardEvent(evtType, {
          key: keyName,
          code: keyCode,
          bubbles: true,
          cancelable: true
        });
        window.dispatchEvent(keyEvent);
        if (isDown && navigator.vibrate) {
          try { navigator.vibrate(8); } catch (e) {}
        }
      };

      // Kontrolleri Aç / Kapat Fonksiyonu
      window.toggleCamControls = function(forceState) {
        var panel = document.getElementById('mobile-camera-controls');
        var trigger = document.getElementById('cam-toggle-trigger');
        if (!panel) return;
        var newState = (typeof forceState === 'boolean') ? forceState : !panel.classList.contains('active');
        if (newState) {
          panel.classList.add('active');
          if (trigger) trigger.classList.add('active');
        } else {
          panel.classList.remove('active');
          if (trigger) trigger.classList.remove('active');
        }
      };

      document.addEventListener('input', function(e) {
        if (e.target && (e.target.type === 'range' || e.target.type === 'number')) {
          var container = e.target.closest('.camera-inspector-section');
          if (container) {
            window.toggleCamControls(true);
          }
        }
      }, true);

      document.addEventListener('click', function(e) {
        var btn = e.target.closest('button');
        if (btn && btn.textContent && (btn.textContent.indexOf('Özel Kamera') !== -1 || btn.textContent.indexOf('Custom Camera') !== -1)) {
          window.toggleCamControls(true);
        } else if (btn && btn.textContent && (btn.textContent.indexOf('Otomatik Kadraj') !== -1 || btn.textContent.indexOf('Auto Frame') !== -1)) {
          window.toggleCamControls(false);
        }
      }, true);

      // Yükleme göstergesini sayfa hazır olunca gizle
      window.addEventListener('DOMContentLoaded', function() {
        var observer = new MutationObserver(function() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            var loader = document.getElementById('boot-loader');
            if (loader) loader.style.display = 'none';
            observer.disconnect();
          }
        });
        var root = document.getElementById('root');
        if (root) observer.observe(root, { childList: true, subtree: true });
      });

      // 4. RENDER ÖNİZLEME VE DIALOG SİSTEMİ
      window.currentRenderData = null;

      window.showRenderResult = function(data) {
        window.currentRenderData = data;

        var modal = document.getElementById('render-preview-modal');
        var img = document.getElementById('render-preview-img');
        var resBadge = document.getElementById('render-res-badge');
        var pathEl = document.getElementById('render-saved-path');
        var copyIcon = document.getElementById('copy-btn-icon');
        var statusLabel = document.querySelector('.render-status-label');
        var shareBtnText = document.querySelector('.btn-share .btn-text');
        var openBtnText = document.querySelector('.btn-open .btn-text');
        if (copyIcon) copyIcon.textContent = '📋';

        if (!modal || !img) return;

        img.src = data.dataUrl;
        if (resBadge) {
          resBadge.textContent = (data.width || 1920) + ' × ' + (data.height || 1080) + ' • PNG';
        }

        var isAndroid = !!window.AndroidBridge;

        if (isAndroid) {
          if (statusLabel) statusLabel.textContent = 'Varsayılan Klasöre Kaydedildi';
          if (shareBtnText) shareBtnText.textContent = 'Paylaş';
          if (openBtnText) openBtnText.textContent = 'Galeride Aç';
          var defaultPath = '/storage/emulated/0/BlockRig/Renders/' + data.filename;
          if (pathEl) pathEl.textContent = defaultPath;

          // AndroidBridge üzerinden varsayılan klasöre anında kaydet
          if (window.AndroidBridge.saveRender) {
            try {
              var resRaw = window.AndroidBridge.saveRender(data.dataUrl, data.filename);
              var res = JSON.parse(resRaw);
              if (res && res.filePath) {
                window.currentRenderData.savedPath = res.filePath;
                if (pathEl) pathEl.textContent = res.filePath;
              }
            } catch(e) {
              console.error('AndroidBridge save error:', e);
            }
          }
        } else {
          // PC / Masaüstü Web Tarayıcısı Ortamı
          if (statusLabel) statusLabel.textContent = 'İndirilenler Klasörüne Kaydedildi';
          if (shareBtnText) shareBtnText.textContent = (navigator.share ? 'Paylaş' : 'Yeniden İndir');
          if (openBtnText) openBtnText.textContent = 'Görseli Aç';
          if (pathEl) pathEl.textContent = 'İndirilenler/' + data.filename;

          // Tarayıcı indirmesini otomatik başlat
          try {
            var a = document.createElement('a');
            a.href = data.dataUrl;
            a.download = data.filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
          } catch(e) {}
        }

        modal.style.display = 'flex';
        setTimeout(function() {
          modal.classList.add('visible');
        }, 10);
      };

      window.closeRenderModal = function() {
        var modal = document.getElementById('render-preview-modal');
        if (modal) {
          modal.classList.remove('visible');
          setTimeout(function() {
            modal.style.display = 'none';
          }, 250);
        }
      };

      window.shareCurrentRender = function() {
        if (!window.currentRenderData) return;
        var filename = window.currentRenderData.filename;
        if (window.AndroidBridge && window.AndroidBridge.shareRender) {
          window.AndroidBridge.shareRender(filename);
        } else if (navigator.share) {
          fetch(window.currentRenderData.dataUrl)
            .then(function(res) { return res.blob(); })
            .then(function(blob) {
              var file = new File([blob], filename, { type: 'image/png' });
              navigator.share({
                title: 'BlockRig Studio Render',
                files: [file]
              }).catch(function() {});
            });
        } else {
          var a = document.createElement('a');
          a.href = window.currentRenderData.dataUrl;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
        }
      };

      window.openCurrentRender = function() {
        if (!window.currentRenderData) return;
        var filename = window.currentRenderData.filename;
        if (window.AndroidBridge && window.AndroidBridge.openRender) {
          window.AndroidBridge.openRender(filename);
        } else {
          var newWin = window.open();
          if (newWin) {
            newWin.document.write('<!DOCTYPE html><html><head><title>' + filename + '</title><style>body{margin:0;background:#090d16;display:flex;align-items:center;justify-content:center;min-height:100vh;}img{max-width:95vw;max-height:95vh;object-fit:contain;}</style></head><body><img src="' + window.currentRenderData.dataUrl + '"/></body></html>');
          }
        }
      };

      window.copyRenderPath = function() {
        var pathEl = document.getElementById('render-saved-path');
        var copyIcon = document.getElementById('copy-btn-icon');
        var text = pathEl ? pathEl.textContent : '';
        if (window.AndroidBridge && window.AndroidBridge.copyToClipboard) {
          window.AndroidBridge.copyToClipboard(text);
        } else if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text);
        }
        if (copyIcon) {
          copyIcon.textContent = '✓';
          setTimeout(function() { copyIcon.textContent = '📋'; }, 2000);
        }
      };

      window.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
