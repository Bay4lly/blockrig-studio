<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>BlockRig Studio</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Modüler Stiller -->
    <link rel="stylesheet" href="./css/webview-base.css" />
    <link rel="stylesheet" href="./css/mobile-camera.css" />
    <link rel="stylesheet" href="./css/render-modal.css" />
    <link rel="stylesheet" href="./assets/index-KKpu0Fkz.css" />

    <!-- Temel Sistem ve Polyfill Modülleri (Sıralama önemlidir) -->
    <script src="./js/error-handler.js"></script>
    <script src="./js/offline-fetch.js"></script>
    <script src="./js/mobile-camera.js"></script>
    <script src="./js/render-modal.js"></script>
    <script src="./js/boot-loader.js"></script>

    <!-- Ana Uygulama Modülü -->
    <script type="module" src="./assets/index-mv455tg1.js"></script>
  </head>
  <body>
    <!-- Açılış Yükleme Ekranı (Siyah ekran kalmasını engeller) -->
    <div id="boot-loader">
      <div class="spinner"></div>
      <p class="loader-text">BlockRig Studio Yükleniyor...</p>
    </div>

    <!-- React Uygulama Kökü -->
    <div id="root"></div>

    <!-- Hızlı Kamera Butonu (Sağ altta 🎮) -->
    <div id="cam-toggle-trigger" onclick="toggleCamControls()" title="Kamera Kontrollerini Aç/Kapat">🎮</div>

    <!-- Mobil Kamera WASD & Ok Tuşları Kontrol Paneli -->
    <div id="mobile-camera-controls">
      <!-- 4 Yönlü D-Pad (W, A, S, D) -->
      <div class="dpad-container">
        <button class="cam-btn btn-up"
          onpointerdown="sendCamKey('w','KeyW',true)"
          onpointerup="sendCamKey('w','KeyW',false)"
          onpointercancel="sendCamKey('w','KeyW',false)"
          onpointerleave="sendCamKey('w','KeyW',false)">▲</button>
        
        <button class="cam-btn btn-left"
          onpointerdown="sendCamKey('a','KeyA',true)"
          onpointerup="sendCamKey('a','KeyA',false)"
          onpointercancel="sendCamKey('a','KeyA',false)"
          onpointerleave="sendCamKey('a','KeyA',false)">◀</button>
        
        <div class="dpad-center">CAM</div>

        <button class="cam-btn btn-right"
          onpointerdown="sendCamKey('d','KeyD',true)"
          onpointerup="sendCamKey('d','KeyD',false)"
          onpointercancel="sendCamKey('d','KeyD',false)"
          onpointerleave="sendCamKey('d','KeyD',false)">▶</button>
        
        <button class="cam-btn btn-down"
          onpointerdown="sendCamKey('s','KeyS',true)"
          onpointerup="sendCamKey('s','KeyS',false)"
          onpointercancel="sendCamKey('s','KeyS',false)"
          onpointerleave="sendCamKey('s','KeyS',false)">▼</button>
      </div>

      <!-- Yüksel / Alçal (E / Q) -->
      <div class="elevation-container">
        <button class="cam-btn"
          title="Yüksel (E)"
          onpointerdown="sendCamKey('e','KeyE',true)"
          onpointerup="sendCamKey('e','KeyE',false)"
          onpointercancel="sendCamKey('e','KeyE',false)"
          onpointerleave="sendCamKey('e','KeyE',false)">⏫</button>
        <button class="cam-btn"
          title="Alçal (Q)"
          onpointerdown="sendCamKey('q','KeyQ',true)"
          onpointerup="sendCamKey('q','KeyQ',false)"
          onpointercancel="sendCamKey('q','KeyQ',false)"
          onpointerleave="sendCamKey('q','KeyQ',false)">⏬</button>
      </div>
    </div>

    <!-- Render Önizleme ve Dışa Aktarma Modalı -->
    <div id="render-preview-modal" class="render-modal-backdrop" onclick="if (event.target === this) closeRenderModal()">
      <div class="render-modal-card">
        <!-- Başlık Bölümü -->
        <div class="render-modal-header">
          <div class="render-header-left">
            <div class="render-badge-icon">✨</div>
            <div class="render-header-text">
              <div class="render-modal-title">Render Tamamlandı</div>
              <div class="render-modal-subtitle" id="render-res-badge">1920 × 1080 • PNG</div>
            </div>
          </div>
          <button class="render-close-btn" onclick="closeRenderModal()" aria-label="Kapat">✕</button>
        </div>

        <!-- Görsel Önizleme (Şeffaf Dama Tahtası) -->
        <div class="render-preview-container">
          <div class="render-preview-checkerboard">
            <img id="render-preview-img" src="" alt="Render Önizleme" />
          </div>
        </div>

        <!-- PC İndirme Başarılı Bilgisi -->
        <div class="render-pc-success-bar" style="display: none;">
          <span class="check-icon">✓</span>
          <span>Render hazırlandı ve bilgisayarınıza indirildi.</span>
        </div>

        <!-- Kaydedilen Dosya Konumu Bilgisi (Android/Mobil) -->
        <div class="render-location-box" style="display: none;">
          <div class="render-location-status">
            <span class="render-status-dot"></span>
            <span class="render-status-label">Varsayılan Klasöre Kaydedildi</span>
          </div>
          <div class="render-path-row">
            <span class="render-folder-icon">📁</span>
            <div class="render-path-text" id="render-saved-path">/storage/emulated/0/BlockRig/Renders/...</div>
            <button class="render-copy-btn" id="render-copy-btn" onclick="copyRenderPath()" title="Konumu Kopyala">
              <span id="copy-btn-icon">📋</span>
            </button>
          </div>
        </div>

        <!-- Aksiyon Butonları -->
        <div class="render-modal-actions">
          <button class="render-action-btn btn-share" onclick="shareCurrentRender()">
            <span class="btn-icon">📤</span>
            <span class="btn-text">Paylaş</span>
          </button>
          <button class="render-action-btn btn-open" onclick="openCurrentRender()">
            <span class="btn-icon">🖼️</span>
            <span class="btn-text">Galeride Aç</span>
          </button>
          <button class="render-action-btn btn-dismiss" onclick="closeRenderModal()">
            <span class="btn-text">Kapat</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
